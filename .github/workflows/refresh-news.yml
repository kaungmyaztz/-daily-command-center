name: Refresh live news

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-live-news
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch five current stories
        run: node scripts/fetch-news.mjs
      - name: Publish changed news
        run: |
          if git diff --quiet -- news.json; then
            echo "News is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- news.json
          git commit -m "Refresh live news"
          git push
